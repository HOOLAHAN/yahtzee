type Score
  @model
  @auth(rules: [
    { allow: public, provider: apiKey, operations: [read] }
    { allow: private, provider: userPools, operations: [create, read] }
  ]) {
  id: ID!
  userId: String!
  username: String!
  score: Int!
  timestamp: AWSDateTime!
}

type Mutation {
  submitScore(id: ID, score: Int!): Score @aws_cognito_user_pools
  updateMyProfile(username: String!, firstName: String!, lastName: String!): UserProfile @aws_cognito_user_pools
  deleteMyProfile: Boolean! @aws_cognito_user_pools
}

type Query {
  myProfile: UserProfile @aws_cognito_user_pools
  usernameAvailable(username: String!): Boolean! @aws_api_key
}

type UserProfile @aws_cognito_user_pools {
  userId: ID!
  username: String!
  firstName: String!
  lastName: String!
}
