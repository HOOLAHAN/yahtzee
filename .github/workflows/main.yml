name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watchAll=false

      - name: Build Project
        run: npm run build
        env:
          REACT_APP_AWS_REGION: ${{ secrets.REACT_APP_AWS_REGION }}
          REACT_APP_USER_POOL_ID: ${{ secrets.REACT_APP_USER_POOL_ID }}
          REACT_APP_CLIENT_ID: ${{ secrets.REACT_APP_CLIENT_ID }}
          REACT_APP_AWS_SYNC_GRAPHQLENDPOINT: ${{ secrets.REACT_APP_AWS_SYNC_GRAPHQLENDPOINT }}
          REACT_APP_APPSYNC_APIKEY: ${{ secrets.REACT_APP_APPSYNC_APIKEY }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Deploy to S3
        run: aws s3 sync ./build s3://yahtzeehub --delete

      - name: Invalidate CloudFront Caches
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3H21E49WJYL7I \
            --paths "/" "/index.html" "/yahtzee" "/yahtzee/" "/yahtzee/*"

          aws cloudfront create-invalidation \
            --distribution-id E1KXD6BYPFG5AF \
            --paths "/*"
